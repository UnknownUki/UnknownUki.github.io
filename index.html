<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiny Hunting Counter ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #111827; /* Dark background */
            background-image: radial-gradient(#374151 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Luxury Ball / Dark Theme Card */
        .luxury-card {
            background: linear-gradient(to bottom, #1f2937 50%, #111827 50%);
            border: 6px solid #fbbf24; /* Gold border */
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .luxury-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 6px;
            background-color: #fbbf24;
            transform: translateY(-50%);
            z-index: 0;
        }

        .luxury-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: #111827;
            border: 6px solid #fbbf24;
            border-radius: 50%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .luxury-inner-btn {
            width: 30px;
            height: 30px;
            background-color: #fbbf24;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }

        .content-layer {
            position: relative;
            z-index: 10;
        }

        .pixel-font { font-family: 'Press Start 2P', cursive; }
        
        /* Sprite container */
        .sprite-container {
            width: 96px;
            height: 96px;
            image-rendering: pixelated; /* Keeps the 2D sprite sharp */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 pt-10 text-white">

    <!-- Tarjeta Principal -->
    <div class="w-full max-w-md luxury-card rounded-3xl overflow-hidden flex flex-col mb-8">
        
        <div class="luxury-center"><div class="luxury-inner-btn"></div></div>

        <!-- MITAD SUPERIOR -->
        <div class="content-layer p-6 h-[320px] flex flex-col items-center justify-start pt-6">
            
            <!-- Buscador y Sprite -->
            <div class="w-full flex items-center justify-between bg-gray-900/80 p-3 rounded-2xl border-2 border-yellow-500/50 mb-4">
                <input 
                    type="text" id="pokemonName" 
                    placeholder="Pokémon..." 
                    class="w-full bg-transparent border-none focus:outline-none text-xl font-bold text-yellow-400 placeholder-gray-500 uppercase"
                    autocomplete="off"
                >
                <div class="relative w-16 h-16 flex-shrink-0 ml-2 bg-gray-800 rounded-lg flex items-center justify-center border border-gray-700">
                    <img id="pokemonSprite" src="" alt="?" class="sprite-container hidden">
                    <span id="spriteStatus" class="text-gray-500 text-2xl">?</span>
                </div>
            </div>
            
            <!-- Contador -->
            <div class="flex items-center space-x-2 drop-shadow-md my-auto">
                <span class="text-3xl text-yellow-400">✨</span>
                <h1 id="counter" class="text-6xl font-black tracking-tighter text-white">0</h1>
                <span class="text-3xl text-yellow-400">✨</span>
            </div>

            <!-- Selector de Probabilidad y Porcentaje -->
            <div class="w-full flex flex-col gap-1 mt-auto">
                <select id="oddsSelector" class="w-full bg-gray-900 text-yellow-400 border-2 border-gray-700 rounded-lg p-2 text-sm font-bold focus:outline-none focus:border-yellow-500">
                    <option value="4096">Full Odds (1/4096)</option>
                    <option value="1365">Amuleto Iris (1/1365)</option>
                    <option value="683">Método Masuda (1/683)</option>
                    <option value="512">Masuda + Amuleto (1/512)</option>
                </select>
                <div class="text-center text-xs text-gray-400 font-bold mt-1">
                    Probabilidad acumulada: <span id="percentageDisplay" class="text-yellow-400 text-sm">0.00%</span>
                </div>
            </div>

        </div>

        <!-- MITAD INFERIOR -->
        <div class="content-layer p-6 h-[320px] flex flex-col items-center justify-end pb-6">
            
            <!-- Botón +1 -->
            <button id="addBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 border-4 border-gray-800 text-3xl font-black py-4 rounded-2xl shadow-[0_6px_0_#1f2937] transition-all active:shadow-[0_0px_0_#1f2937] active:translate-y-[6px] mb-4">
                +1 ENCUENTRO
            </button>

            <!-- Botones Secundarios -->
            <div class="flex w-full gap-3 mb-4">
                <button id="subBtn" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white border-2 border-gray-900 text-lg font-bold py-2 rounded-xl transition-all">
                    -1
                </button>
                <button id="resetBtn" class="flex-1 bg-red-900 hover:bg-red-800 text-white border-2 border-gray-900 text-lg font-bold py-2 rounded-xl transition-all">
                    Reset
                </button>
            </div>

            <!-- Botón Captura -->
            <button id="catchBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-gray-900 text-lg font-black py-3 rounded-xl transition-all animate-pulse">
                ¡SHINY ATRAPADO!
            </button>

        </div>
    </div>

    <!-- Sala de Trofeos -->
    <div class="w-full max-w-md bg-gray-800 border-2 border-gray-700 rounded-3xl p-6 mb-12">
        <h2 class="text-2xl font-black text-yellow-400 mb-4 text-center border-b border-gray-700 pb-2">🏆 Sala de Trofeos</h2>
        <div id="trophyRoom" class="grid grid-cols-1 gap-3">
            <!-- Los trofeos se insertarán aquí por JS -->
            <p id="emptyTrophies" class="text-gray-500 text-center text-sm font-bold italic py-4">Aún no has atrapado ningún shiny. ¡Buena suerte!</p>
        </div>
    </div>

    <script>
        // DOM Elements
        const counterEl = document.getElementById('counter');
        const pokemonNameInput = document.getElementById('pokemonName');
        const pokemonSprite = document.getElementById('pokemonSprite');
        const spriteStatus = document.getElementById('spriteStatus');
        const oddsSelector = document.getElementById('oddsSelector');
        const percentageDisplay = document.getElementById('percentageDisplay');
        const addBtn = document.getElementById('addBtn');
        const subBtn = document.getElementById('subBtn');
        const resetBtn = document.getElementById('resetBtn');
        const catchBtn = document.getElementById('catchBtn');
        const trophyRoom = document.getElementById('trophyRoom');
        const emptyTrophies = document.getElementById('emptyTrophies');

        // State
        let count = 0;
        let currentPokemon = "";
        let currentOdds = 4096;
        let currentSpriteUrl = "";
        let trophies = [];
        let fetchTimeout;

        // --- Core Functions ---
        function updateDisplay() {
            counterEl.textContent = count;
            
            // Calculate percentage: 1 - (1 - 1/odds)^count
            const odds = parseInt(oddsSelector.value);
            let probability = 1 - Math.pow(1 - (1 / odds), count);
            probability = (probability * 100).toFixed(2);
            percentageDisplay.textContent = `${probability}%`;
            
            saveData();
        }

        async function fetchPokemonSprite(name) {
            if (!name) {
                pokemonSprite.classList.add('hidden');
                spriteStatus.classList.remove('hidden');
                spriteStatus.textContent = '?';
                spriteStatus.className = 'text-gray-500 text-2xl';
                currentSpriteUrl = "";
                return;
            }

            spriteStatus.classList.remove('hidden');
            spriteStatus.textContent = '...';
            pokemonSprite.classList.add('hidden');

            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name.toLowerCase().trim()}`);
                if (!response.ok) throw new Error('Not found');
                
                const data = await response.json();
                // Get the classic 2D front shiny sprite, fallback to default if shiny missing
                const spriteUrl = data.sprites.front_shiny || data.sprites.front_default;
                
                if (spriteUrl) {
                    pokemonSprite.src = spriteUrl;
                    currentSpriteUrl = spriteUrl;
                    pokemonSprite.onload = () => {
                        pokemonSprite.classList.remove('hidden');
                        spriteStatus.classList.add('hidden');
                    };
                } else {
                    throw new Error('No sprite');
                }
            } catch (error) {
                spriteStatus.textContent = '✖';
                spriteStatus.className = 'text-red-500 text-2xl font-black';
                currentSpriteUrl = "";
            }
        }

        function renderTrophies() {
            if (trophies.length === 0) {
                emptyTrophies.style.display = 'block';
                return;
            }
            emptyTrophies.style.display = 'none';
            
            // Clear existing (except empty text)
            const elements = trophyRoom.querySelectorAll('.trophy-card');
            elements.forEach(el => el.remove());

            // Render from newest to oldest
            [...trophies].reverse().forEach(trophy => {
                const div = document.createElement('div');
                div.className = 'trophy-card bg-gray-900 border border-gray-700 rounded-xl p-3 flex items-center gap-4';
                
                const imgStr = trophy.sprite 
                    ? `<img src="${trophy.sprite}" class="w-16 h-16 image-pixelated" alt="${trophy.name}">` 
                    : `<div class="w-16 h-16 flex items-center justify-center text-gray-600 text-xl font-bold bg-gray-800 rounded">?</div>`;

                div.innerHTML = `
                    ${imgStr}
                    <div class="flex-1">
                        <h3 class="text-yellow-400 font-bold uppercase text-lg leading-tight">${trophy.name || 'Desconocido'}</h3>
                        <p class="text-gray-300 text-sm">Intentos: <span class="font-black text-white">${trophy.count}</span></p>
                        <p class="text-gray-500 text-xs">Probabilidad: 1/${trophy.odds} (${trophy.percentage}%)</p>
                    </div>
                `;
                trophyRoom.appendChild(div);
            });
        }

        // --- Local Storage ---
        function loadData() {
            const savedData = JSON.parse(localStorage.getItem('shinyHunterProData')) || {};
            
            count = savedData.count || 0;
            currentPokemon = savedData.currentPokemon || "";
            currentOdds = savedData.currentOdds || 4096;
            trophies = savedData.trophies || [];

            pokemonNameInput.value = currentPokemon;
            oddsSelector.value = currentOdds;
            
            if (currentPokemon) {
                fetchPokemonSprite(currentPokemon);
            }
            
            updateDisplay();
            renderTrophies();
        }

        function saveData() {
            const dataToSave = {
                count,
                currentPokemon: pokemonNameInput.value,
                currentOdds: oddsSelector.value,
                trophies
            };
            localStorage.setItem('shinyHunterProData', JSON.stringify(dataToSave));
        }

        // --- Event Listeners ---
        addBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        subBtn.addEventListener('click', () => {
            if (count > 0) {
                count--;
                updateDisplay();
            }
        });

        resetBtn.addEventListener('click', () => {
            if(confirm('¿Seguro que quieres reiniciar el contador a 0?')) {
                count = 0;
                updateDisplay();
            }
        });

        oddsSelector.addEventListener('change', () => {
            updateDisplay();
        });

        pokemonNameInput.addEventListener('input', (e) => {
            currentPokemon = e.target.value;
            saveData();
            
            // Debounce fetch
            clearTimeout(fetchTimeout);
            fetchTimeout = setTimeout(() => {
                fetchPokemonSprite(currentPokemon);
            }, 800); // Waits 800ms after typing stops before calling API
        });

        catchBtn.addEventListener('click', () => {
            if (count === 0 && !currentPokemon) {
                alert("¡Necesitas buscar un Pokémon y tener al menos 1 encuentro antes de atraparlo!");
                return;
            }

            if(confirm(`¡Felicidades! ¿Quieres guardar este ${currentPokemon.toUpperCase() || 'Pokémon'} en tu Sala de Trofeos?`)) {
                // Save to trophies
                trophies.push({
                    name: currentPokemon,
                    count: count,
                    odds: oddsSelector.value,
                    percentage: percentageDisplay.textContent.replace('%', ''),
                    sprite: currentSpriteUrl,
                    date: new Date().toISOString()
                });

                // Reset current
                count = 0;
                pokemonNameInput.value = "";
                currentPokemon = "";
                currentSpriteUrl = "";
                pokemonSprite.classList.add('hidden');
                spriteStatus.classList.remove('hidden');
                spriteStatus.textContent = '?';
                spriteStatus.className = 'text-gray-500 text-2xl';

                updateDisplay();
                renderTrophies();
                saveData();
            }
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
