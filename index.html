<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiny Hunting Counter ✨</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente de Google para un aspecto más limpio -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Fondo que simula una textura sutil */
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Animación para el botón de sumar */
        .pop-animation:active {
            transform: scale(0.95);
        }

        /* Estilo tipo Pokéball para la tarjeta principal */
        .pokeball-card {
            background: linear-gradient(to bottom, #ef4444 50%, #ffffff 50%);
            border: 8px solid #1f2937;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* Línea central negra de la Pokéball */
        .pokeball-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 8px;
            background-color: #1f2937;
            transform: translateY(-50%);
            z-index: 0;
        }

        /* Círculo central de la Pokéball */
        .pokeball-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border: 8px solid #1f2937;
            border-radius: 50%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pokeball-inner-btn {
            width: 40px;
            height: 40px;
            background-color: #f3f4f6;
            border: 4px solid #1f2937;
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        /* Asegurar que el contenido esté por encima de los adornos de la Pokéball */
        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* Efecto de brillo para el contador */
        .shiny-text {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor principal responsive -->
    <div class="w-full max-w-md w-full pokeball-card rounded-3xl overflow-hidden flex flex-col">
        
        <!-- Adorno central de la Pokéball (solo visual) -->
        <div class="pokeball-center">
            <div class="pokeball-inner-btn"></div>
        </div>

        <!-- MITAD SUPERIOR (Roja) -->
        <div class="content-layer p-6 h-64 flex flex-col items-center justify-start pt-8">
            
            <div class="w-full bg-white/90 p-2 rounded-xl border-4 border-gray-800 shadow-inner mb-6">
                <!-- Input para el nombre del Pokémon -->
                <input 
                    type="text" 
                    id="pokemonName" 
                    placeholder="¿A quién buscas? ✨" 
                    class="w-full text-center text-xl font-bold text-gray-800 bg-transparent border-none focus:outline-none placeholder-gray-500 uppercase"
                    autocomplete="off"
                >
            </div>
            
            <div class="flex items-center space-x-3 text-white drop-shadow-md">
                <span class="text-4xl">✨</span>
                <!-- Contador Central -->
                <h1 id="counter" class="text-7xl font-black shiny-text tracking-tighter">0</h1>
                <span class="text-4xl">✨</span>
            </div>

        </div>

        <!-- MITAD INFERIOR (Blanca) -->
        <div class="content-layer p-6 h-64 bg-transparent flex flex-col items-center justify-end pb-8">
            
            <!-- Botón Gigante +1 -->
            <button 
                id="addBtn" 
                class="w-full bg-emerald-400 hover:bg-emerald-500 text-gray-900 border-4 border-gray-800 text-3xl font-black py-5 rounded-2xl shadow-[0_6px_0_#1f2937] transition-all active:shadow-[0_0px_0_#1f2937] active:translate-y-[6px] mb-6 flex items-center justify-center gap-2"
            >
                <span>+1</span>
                <span class="text-xl">Encuentro</span>
            </button>

            <!-- Botones secundarios -->
            <div class="flex w-full gap-4">
                <button 
                    id="subBtn" 
                    class="flex-1 bg-yellow-300 hover:bg-yellow-400 text-gray-900 border-4 border-gray-800 text-xl font-bold py-3 rounded-xl shadow-[0_4px_0_#1f2937] transition-all active:shadow-[0_0px_0_#1f2937] active:translate-y-[4px]"
                >
                    -1
                </button>
                <button 
                    id="resetBtn" 
                    class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-900 border-4 border-gray-800 text-xl font-bold py-3 rounded-xl shadow-[0_4px_0_#1f2937] transition-all active:shadow-[0_0px_0_#1f2937] active:translate-y-[4px]"
                >
                    Reset
                </button>
            </div>

        </div>
    </div>

    <!-- Modal de confirmación para el Reset -->
    <div id="resetModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white border-4 border-gray-800 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 opacity-0 transition-all duration-200" id="modalContent">
            <h2 class="text-2xl font-black text-gray-800 mb-2">¿Estás seguro?</h2>
            <p class="text-gray-600 font-semibold mb-6">Esto pondrá el contador a 0 y no se puede deshacer.</p>
            <div class="flex gap-3">
                <button id="cancelResetBtn" class="flex-1 bg-gray-200 border-4 border-gray-800 py-2 rounded-xl font-bold text-gray-800 hover:bg-gray-300 transition-colors">Cancelar</button>
                <button id="confirmResetBtn" class="flex-1 bg-red-500 border-4 border-gray-800 py-2 rounded-xl font-bold text-white hover:bg-red-600 transition-colors">Sí, reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        // Referencias a los elementos del DOM
        const counterEl = document.getElementById('counter');
        const pokemonNameInput = document.getElementById('pokemonName');
        const addBtn = document.getElementById('addBtn');
        const subBtn = document.getElementById('subBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // Elementos del Modal
        const resetModal = document.getElementById('resetModal');
        const modalContent = document.getElementById('modalContent');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const confirmResetBtn = document.getElementById('confirmResetBtn');

        // Variables de estado
        let count = 0;

        // --- FUNCIONES DE ALMACENAMIENTO LOCAL ---
        // Para que el usuario no pierda el progreso si recarga la página
        function loadData() {
            const savedCount = localStorage.getItem('shinyCount');
            const savedName = localStorage.getItem('shinyPokemon');
            
            if (savedCount !== null) {
                count = parseInt(savedCount, 10);
                updateDisplay();
            }
            if (savedName !== null) {
                pokemonNameInput.value = savedName;
            }
        }

        function saveData() {
            localStorage.setItem('shinyCount', count);
            localStorage.setItem('shinyPokemon', pokemonNameInput.value);
        }

        // --- LÓGICA DE LA INTERFAZ ---
        function updateDisplay() {
            counterEl.textContent = count;
            
            // Pequeña animación al actualizar
            counterEl.style.transform = 'scale(1.2)';
            setTimeout(() => {
                counterEl.style.transform = 'scale(1)';
                counterEl.style.transition = 'transform 0.1s ease-out';
            }, 50);
        }

        // Event Listeners
        addBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
            saveData();
        });

        subBtn.addEventListener('click', () => {
            if (count > 0) {
                count--;
                updateDisplay();
                saveData();
            }
        });

        pokemonNameInput.addEventListener('input', () => {
            saveData();
        });

        // --- LÓGICA DEL MODAL DE REINICIO ---
        resetBtn.addEventListener('click', () => {
            resetModal.classList.remove('hidden');
            resetModal.classList.add('flex');
            // Pequeño timeout para que la transición CSS funcione al mostrar
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        });

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                resetModal.classList.add('hidden');
                resetModal.classList.remove('flex');
            }, 200);
        }

        cancelResetBtn.addEventListener('click', closeModal);

        confirmResetBtn.addEventListener('click', () => {
            count = 0;
            updateDisplay();
            saveData();
            closeModal();
        });

        // Cerrar modal al hacer clic fuera de la tarjeta
        resetModal.addEventListener('click', (e) => {
            if (e.target === resetModal) {
                closeModal();
            }
        });

        // Cargar datos al iniciar la página
        loadData();
    </script>
</body>
</html>
